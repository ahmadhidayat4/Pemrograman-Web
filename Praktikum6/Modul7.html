<!DOCTYPE html>
<html>
<head>
  <title>Latihan Validasi Form</title>
</head>
<body>
  <h2>Form Pendaftaran</h2>
  <form id="myForm" novalidate>
    <label for="nama">Nama:</label><br>
    <input type="text" id="nama">
    <span id="errNama" style="color:red"></span><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email">
    <span id="errEmail" style="color:red"></span><br><br>

    <label for="umur">Umur:</label><br>
    <input type="number" id="umur">
    <span id="errUmur" style="color:red"></span><br><br>

    <input type="submit" value="Kirim">
  </form>

  <script src="Modul7.js"></script>
</body>
</html>
